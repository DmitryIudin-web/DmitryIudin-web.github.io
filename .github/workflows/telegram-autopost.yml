name: Telegram autopost

# When new pages (news, guides, model landings) land on main, post announcements
# to the @ASTavtomoto channel. Requires the TELEGRAM_BOT_TOKEN repo secret
# (bot must be an admin of the channel); without it the run is a green no-op.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: telegram-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect newly added pages
        id: added
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
          fi
          git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- '**/index.html' > added.txt || true
          echo "count=$(wc -l < added.txt)" >> "$GITHUB_OUTPUT"
          cat added.txt

      - name: Post to Telegram
        if: steps.added.outputs.count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@ASTavtomoto' }}
        run: xargs -a added.txt python3 scripts/telegram_autopost.py
