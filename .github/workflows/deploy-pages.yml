name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Make Tavendor form work on Pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('volkswagen-tavendor-2026/index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'id="ast-pages-tavendor-form-fallback"'
          if marker not in html:
              script = r'''<script id="ast-pages-tavendor-form-fallback">
          (function(){
            const form=document.getElementById('tavendor-form');
            if(!form)return;
            form.addEventListener('submit',function(ev){
              ev.preventDefault();
              ev.stopImmediatePropagation();
              if(!form.reportValidity())return;
              const data=Object.fromEntries(new FormData(form).entries());
              try{if(typeof ym==='function')ym(106049767,'reachGoal','tavendor_form_whatsapp',{color:data.color||'',deal:data.deal_format||''});}catch(e){}
              const text=[
                'Интересует Volkswagen Tavendor 2026 за 5 900 000 ₽.',
                'Цвет: '+(data.color||'не выбран')+'.',
                'Формат: '+(data.deal_format||'не выбран')+'.',
                'Контакт: '+(data.contact||'')+'.',
                data.name?'Имя: '+data.name+'.':'',
                'Источник: '+location.href
              ].filter(Boolean).join(' ');
              location.href='https://wa.me/79170115218?text='+encodeURIComponent(text);
            },true);
          })();
          </script>'''
              html = html.replace('</body>', script + '\n</body>')
              path.write_text(html, encoding='utf-8')
          PY

      - name: Exclude agent config from published artifact
        # .claude/ содержит внутреннюю экономику КП (ставки, маржа).
        # Артефакт грузится из корня (path: .) и .nojekyll не фильтрует
        # dot-каталоги, поэтому убираем каталог до upload.
        run: rm -rf .claude

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4