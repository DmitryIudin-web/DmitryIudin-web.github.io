name: Materialize Tavendor landing

on:
  push:
    branches:
      - codex/tavendor-yandex-direct-5990
    paths:
      - volkswagen-tavendor-2026/index-source/READY

permissions:
  contents: write

concurrency:
  group: materialize-tavendor-landing
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout landing branch
        uses: actions/checkout@v4
        with:
          ref: codex/tavendor-yandex-direct-5990
          fetch-depth: 0

      - name: Restore self-contained HTML
        shell: bash
        run: |
          set -euo pipefail
          test -f volkswagen-tavendor-2026/index-source/READY
          cat volkswagen-tavendor-2026/index-source/index.html.gz.b64.part* \
            | tr -d '\r\n ' \
            | base64 --decode > /tmp/tavendor-index.html.gz
          gzip -dc /tmp/tavendor-index.html.gz > volkswagen-tavendor-2026/index.html

          grep -q 'Volkswagen Tavendor' volkswagen-tavendor-2026/index.html
          grep -q '5 990 000' volkswagen-tavendor-2026/index.html
          test "$(grep -o 'data:image/jpeg;base64,' volkswagen-tavendor-2026/index.html | wc -l)" -ge 2
          test "$(wc -c < volkswagen-tavendor-2026/index.html)" -gt 50000

          rm -rf volkswagen-tavendor-2026/index-source
          rm -rf volkswagen-tavendor-2026/assets-source
          rm -f .github/workflows/yandex-direct-tavendor.yml
          rm -f .github/workflows/materialize-tavendor-campaign.yml

      - name: Commit production landing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Опубликовать самодостаточную посадочную Tavendor [skip ci]"
          git push origin HEAD:codex/tavendor-yandex-direct-5990
