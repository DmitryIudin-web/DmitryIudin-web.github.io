name: Materialize Tavendor campaign payload

on:
  push:
    branches:
      - codex/tavendor-yandex-direct-5990
    paths:
      - campaign-payload/READY

permissions:
  contents: write

concurrency:
  group: materialize-tavendor-campaign
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout campaign branch
        uses: actions/checkout@v4
        with:
          ref: codex/tavendor-yandex-direct-5990
          fetch-depth: 0

      - name: Stop cleanly when payload was already consumed
        id: payload
        shell: bash
        run: |
          if [[ -f campaign-payload/READY ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore campaign files and binary creatives
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat campaign-payload/tavendor-full.tar.gz.b64.part* \
            | tr -d '\r\n ' \
            | base64 --decode > /tmp/tavendor-full.tar.gz
          tar -xzf /tmp/tavendor-full.tar.gz -C .
          rm -rf campaign-payload volkswagen-tavendor-2026/assets-source

      - name: Set up Python
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yandex_direct/requirements.txt

      - name: Validate restored payload
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r scripts/yandex_direct/requirements.txt
          python scripts/yandex_direct/deploy_tavendor_2026.py validate
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for rel in (
              "volkswagen-tavendor-2026/assets/white.jpg",
              "volkswagen-tavendor-2026/assets/green.jpg",
          ):
              path = Path(rel)
              assert path.exists() and path.stat().st_size > 10_000, rel
              with Image.open(path) as image:
                  assert image.format == "JPEG", (rel, image.format)
                  assert min(image.size) >= 450, (rel, image.size)
                  image.verify()
          PY

      - name: Commit generated campaign implementation
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Реализовать кампанию Яндекс.Директа для Tavendor [skip ci]"
          git push origin HEAD:codex/tavendor-yandex-direct-5990
