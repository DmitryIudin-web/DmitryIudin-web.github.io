name: Inject AST conversion runtime

# Подключает assets/ast-conversion.* на все HTML-страницы (Этап 1 «Измерение +
# конверсия»). Запускается вручную — в т.ч. после публикации нового снапшота
# из Tilda, чтобы вернуть сниппет на страницы.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject runtime include into pages
        run: python3 scripts/inject-ast-conversion.py
      - name: Commit and push if pages changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: include ast-conversion runtime on all pages"
            git push
          fi
