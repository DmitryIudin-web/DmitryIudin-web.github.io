name: Yandex Direct · Volkswagen Tavendor 2026

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to execute
        required: true
        default: validate
        type: choice
        options:
          - validate
          - plan
          - preflight
          - deploy
          - moderate
          - status
          - launch
          - scale
          - watchdog
          - suspend
      environment:
        description: Direct API environment
        required: true
        default: sandbox
        type: choice
        options:
          - sandbox
          - production
      confirm_write:
        description: Type YES for production writes that do not enable spend
        required: true
        default: "NO"
        type: string
      confirm_spend:
        description: Type YES only for launch or scale
        required: true
        default: "NO"
        type: string
      skip_landing_check:
        description: Skip public landing-page check
        required: true
        default: false
        type: boolean

concurrency:
  group: yandex-direct-tavendor-2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/yandex_direct/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/yandex_direct/requirements.txt

      - name: Validate campaign and run regression tests
        run: |
          python scripts/yandex_direct/deploy_tavendor_2026.py validate
          python -m unittest discover -s tests -v

      - name: Execute selected action
        if: ${{ inputs.action != 'validate' }}
        env:
          YANDEX_DIRECT_OAUTH_TOKEN: ${{ secrets.YANDEX_DIRECT_OAUTH_TOKEN }}
          YANDEX_DIRECT_CLIENT_LOGIN: ${{ secrets.YANDEX_DIRECT_CLIENT_LOGIN }}
          YANDEX_DIRECT_METRIKA_GOAL_ID: ${{ secrets.YANDEX_DIRECT_METRIKA_GOAL_ID }}
          ACTION: ${{ inputs.action }}
          DIRECT_ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
          CONFIRM_SPEND: ${{ inputs.confirm_spend }}
          SKIP_LANDING_CHECK: ${{ inputs.skip_landing_check }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$ACTION")
          if [[ "$DIRECT_ENVIRONMENT" == "production" ]]; then
            args+=(--live)
          fi
          args+=(--confirm-write "$CONFIRM_WRITE" --confirm-spend "$CONFIRM_SPEND")
          if [[ "$SKIP_LANDING_CHECK" == "true" ]]; then
            args+=(--skip-landing-check)
          fi
          python scripts/yandex_direct/deploy_tavendor_2026.py "${args[@]}"

      - name: Upload non-secret deployment snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tavendor-direct-${{ inputs.action }}-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: campaigns/yandex-direct/tavendor-2026/deployment_result.json
